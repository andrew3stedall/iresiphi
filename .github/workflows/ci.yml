name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86:
    name: x86 CI
    # Terraform manages this repository variable. The fallback bootstraps CI
    # before the repository settings have been applied.
    runs-on: ${{ vars.CI_X86_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify x86 runner
        shell: bash
        run: |
          architecture="$(uname -m)"
          if [[ "$architecture" != "x86_64" ]]; then
            echo "::error::x86 CI requires x86_64; received $architecture"
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform for validation
        run: terraform -chdir=infra/github init -backend=false -lockfile=readonly

      - name: Validate repository settings
        run: terraform -chdir=infra/github validate

  rust:
    name: Rust tests and workload (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: ${{ vars.CI_X86_RUNNER || 'ubuntu-24.04' }}
            machine: x86_64
          - arch: arm
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      IRESIPHI_EXPECTED_ARCH: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify architecture and install pinned Rust
        run: |
          test "$(uname -m)" = "$IRESIPHI_EXPECTED_ARCH"
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('src/**', 'tests/**', 'examples/**') }}
          restore-keys: rust-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - name: Verify dependency notices
        run: |
          python3 scripts/third_party_notices.py --output /tmp/THIRD_PARTY_NOTICES.md
          diff -u THIRD_PARTY_NOTICES.md /tmp/THIRD_PARTY_NOTICES.md
      - name: Set up ARM CPython 3.12
        if: matrix.arch == 'arm'
        id: arm-python312
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Set up ARM CPython 3.13
        if: matrix.arch == 'arm'
        id: arm-python313
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Build and test installed native ARM wheels
        if: matrix.arch == 'arm'
        env:
          IRESIPHI_PY312: ${{ steps.arm-python312.outputs.python-path }}
          IRESIPHI_PY313: ${{ steps.arm-python313.outputs.python-path }}
        run: bash scripts/ci/test-arm-wheels.sh
      - name: Measure complete 100,000-line workload and cancellation
        run: bash scripts/ci/workload.sh
      - name: Preserve workload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.arch }}-workload-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-artifacts
          if-no-files-found: warn

  wheels:
    name: Audited cp312/cp313 manylinux wheels (x86)
    runs-on: ${{ vars.CI_X86_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      # Resolved from Quay on 2026-11-12; both build and clean test images are immutable.
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build from sdist and audit wheels
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p ci-artifacts
          docker pull "$MANYLINUX_IMAGE"
          docker image inspect "$MANYLINUX_IMAGE" > ci-artifacts/build-image.json
          docker run --rm -v "$PWD:/io" "$MANYLINUX_IMAGE" bash /io/scripts/ci/build-wheels.sh
      - name: Install and test each wheel offline on glibc 2.28
        run: |
          for abi in cp312-cp312 cp313-cp313; do
            docker run --rm --network none \
              -v "$PWD/ci-artifacts/dist:/dist:ro" \
              -v "$PWD/tests:/tests:ro" -v "$PWD/scripts:/scripts:ro" \
              "$MANYLINUX_IMAGE" bash /scripts/ci/test-wheel.sh "$abi" \
              2>&1 | tee "ci-artifacts/$abi-clean-install.txt"
          done
      - name: Preserve distributions and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86-distributions-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-artifacts
          if-no-files-found: warn

  node:
    name: Node ${{ matrix.node }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24.11.1']
        include:
          - arch: x86
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm
            runner: ubuntu-24.04-arm
            machine: aarch64
        arch: [x86, arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          test "$(uname -m)" = '${{ matrix.machine }}'
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
      - name: Install pinned Node
        shell: bash
        run: |
          arch=x64
          if [[ '${{ matrix.arch }}' == arm ]]; then arch=arm64; fi
          version='${{ matrix.node }}'
          curl --fail --silent --show-error -O "https://nodejs.org/dist/v$version/node-v$version-linux-$arch.tar.xz"
          curl --fail --silent --show-error -o SHASUMS256.txt "https://nodejs.org/dist/v$version/SHASUMS256.txt"
          sha256sum --check --ignore-missing SHASUMS256.txt
          tar -xf "node-v$version-linux-$arch.tar.xz"
          echo "$PWD/node-v$version-linux-$arch/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            bindings/node/target
          key: node-${{ matrix.arch }}-${{ matrix.node }}-${{ hashFiles('bindings/node/Cargo.lock', 'src/**', 'bindings/node/src/**') }}
      - name: Build and test addon and declarations
        working-directory: bindings/node
        run: |
          cargo fmt --manifest-path Cargo.toml -- --check
          npm ci
          npm run build
          npm test
          npm run typecheck
