[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "iresiphi"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
description = "Source-preserving local recipe developer preview"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "iresiphi._native"
