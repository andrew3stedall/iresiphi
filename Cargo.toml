[package]
name = "iresiphi"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Source-preserving local recipes: developer preview of an auditable invoice review"
repository = "https://github.com/andrew3stedall/iresiphi"
readme = "README.md"
# Distributions (the crate and the Python sdist) carry only what builds, tests and
# documents the library. Vendored agent skills, planning specs and research notes
# stay in the repository.
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/scripts/generate_fixture.py",
    "/scripts/third_party_notices.py",
    "/python/**",
    "/docs/preview.md",
    "/docs/measurements/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/pyproject.toml",
    "/rust-toolchain.toml",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
datafusion = { version = "=55.2.0", default-features = false, features = ["sql"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
csv = "=1.4.0"
calamine = "=0.38.0"
pyo3 = { version = "=0.30.1", optional = true, features = ["extension-module"] }
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
sha2 = "=0.11.1"
chrono = "=0.4.45"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time", "macros"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
